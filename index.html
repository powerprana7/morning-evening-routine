<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Routine</title>

<!-- 홈 화면에 추가했을 때 앱처럼 뜨게 하는 부분.
     file:// 로 열면 매니페스트·서비스워커는 조용히 무시된다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fdfaf3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ═══════════════════════════════════════════════════════════════════
   루틴 실행기 — 단일 파일. 외부 의존성 없음 (D-002)
   ═══════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fdfaf3;  --fg: #23211c;  --muted: #8d8578;  --line: #e6e0d3;
  --accent: #c2703a;  --btn-bg: #23211c;  --btn-fg: #fdfaf3;
  --pad: clamp(20px, 5vw, 48px);
}
body[data-theme="dark"] {
  --bg: #0d1015;  --fg: #e7e9ed;  --muted: #6d7783;  --line: #1e242c;
  --accent: #7fa8cc;  --btn-bg: #e7e9ed;  --btn-fg: #0d1015;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background .4s ease, color .4s ease;
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  /* min-height 만 주면 flex 자식이 화면 밖으로 자란다 — 높이를 확정해야
     .summary 의 내부 스크롤이 생긴다 */
  height: 100vh;
  height: 100dvh;
  padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad)
           calc(var(--pad) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

/* ── 화면 전환 ─────────────────────────────────────────────────── */
/* min-height:0 이 없으면 flex 자식의 기본값(auto) 때문에 내용만큼 늘어나
   내부 스크롤이 만들어지지 않는다 */
.screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
.screen.active { display: flex; }

/* ── 공통 버튼 ─────────────────────────────────────────────────── */
button {
  font: inherit; color: inherit; background: none; border: none;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.primary {
  width: 100%; max-width: 560px; margin: 0 auto;
  min-height: 68px; padding: 20px 24px;
  background: var(--btn-bg); color: var(--btn-fg);
  border-radius: 18px;
  font-size: clamp(1.05rem, 3.6vw, 1.3rem); font-weight: 650;
  letter-spacing: -.01em;
  transition: transform .12s ease, opacity .12s ease;
}
.primary:active { transform: scale(.975); opacity: .9; }
.ghost {
  color: var(--muted); font-size: .88rem; padding: 12px 16px;
  border-radius: 10px; min-height: 44px;
}
.ghost:active { opacity: .55; }

/* ── 시작 화면 ─────────────────────────────────────────────────── */
/* 자주 쓰는 루틴은 여기 큰 버튼으로 바로 보이고, 가끔 쓰는 것은
   오른쪽 위 메뉴 아이콘 뒤에 있다 (D-023) */
#screen-start { gap: 20px; }
.start-head { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.start-brand { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
.icon-btn {
  flex: none; width: 48px; height: 48px; border-radius: 14px;
  display: grid; place-items: center; font-size: 1.2rem; color: var(--muted);
  border: 1px solid var(--line);
  transition: opacity .12s ease, border-color .15s ease;
}
.icon-btn:active { opacity: .55; }

/* 루틴 고르기 목록 — 시작 화면과 '가끔' 화면이 같은 모양을 쓴다 */
.pick-list {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  width: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px; padding: 4px 0;
}
/* safe center — 화면이 짧아 목록이 넘칠 때 가운데 정렬이 첫 항목을 위로
   밀어내 손댈 수 없게 만드는 것을 막는다. 모르는 브라우저는 앞줄로 떨어진다 */
.pick-list.middle { justify-content: center; justify-content: safe center; }
.routine-btn {
  flex: none; width: 100%; text-align: left;
  padding: 22px 24px; border-radius: 18px;
  border: 1px solid var(--line); background: transparent;
  display: flex; flex-direction: column; gap: 6px; min-height: 68px;
  transition: transform .12s ease, opacity .12s ease;
}
.routine-btn:active { transform: scale(.985); opacity: .9; }
/* 시간대로 제안된 하나만 채워서 그린다 — 예전 `시작` 버튼 자리를 대신한다 */
.routine-btn[data-suggested="true"] {
  background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg);
}
.rb-name {
  font-size: clamp(1.25rem, 5vw, 1.7rem); font-weight: 700;
  letter-spacing: -.02em; line-height: 1.3; word-break: keep-all;
}
.rb-sub { color: var(--muted); font-size: .84rem; }
.routine-btn[data-suggested="true"] .rb-sub { color: var(--btn-fg); opacity: .68; }
.start-actions {
  flex: none; width: 100%; max-width: 560px; margin: 0 auto;
  display: flex; gap: 4px; justify-content: center;
}

/* ── 가끔 하는 루틴 화면 ───────────────────────────────────────── */
#screen-more { gap: 16px; max-width: 560px; width: 100%; margin: 0 auto; }
.more-empty { color: var(--muted); font-size: .88rem; text-align: center; padding: 48px 0; }

/* ── 루틴 고르개 (편집 화면 탭) ────────────────────────────────── */
.mode-pick {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 6px;
  border: 1px solid var(--line); border-radius: 999px;
}
.mode-pick button {
  padding: 10px 18px; border-radius: 999px; font-size: .92rem;
  font-weight: 600; color: var(--muted); min-height: 44px;
}
.mode-pick button[aria-selected="true"] { background: var(--btn-bg); color: var(--btn-fg); }
.footnote {
  position: fixed; right: 14px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  color: var(--muted); font-size: .68rem; opacity: .55; letter-spacing: .02em;
}

/* ── 항목 화면 ─────────────────────────────────────────────────── */
#screen-run { justify-content: space-between; }

.topbar { display: flex; flex-direction: column; gap: 12px; }
.counter { display: flex; justify-content: space-between; align-items: baseline;
           color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent);
           border-radius: 2px; transition: width .35s ease; }

.card {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center;
  gap: 20px; padding: 24px 0;
  min-height: 0; overflow-y: auto;   /* 긴 항목명이 작은 화면에서 잘리지 않게 */
  transition: opacity .22s ease, transform .22s ease;
}
.card.leaving { opacity: 0; transform: translateY(-18px) scale(.97); }
.card.entering { opacity: 0; transform: translateY(14px); }

.item-name {
  font-size: clamp(1.7rem, 6.4vw, 3.1rem);
  font-weight: 700; line-height: 1.32; letter-spacing: -.025em;
  max-width: 16ch; word-break: keep-all;
}
.item-note { color: var(--muted); font-size: clamp(.9rem, 3.4vw, 1.1rem); max-width: 26ch; word-break: keep-all; }
.times { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.times.reached { color: var(--accent); font-weight: 600; }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.subactions { display: flex; gap: 4px; }

/* ── 뷰 방식 전환 (D-024) ──────────────────────────────────────────
   기본값은 루틴이 정한다 (ROUTINES.<키>.view). 이 버튼은 그 회차에만
   걸리는 예외이고, 다음에 시작하면 루틴의 기본값으로 돌아간다. */
.counter-right { display: flex; align-items: center; gap: 10px; }
.view-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 8px;
  /* 글자 높이만큼만 자리를 차지하게 — 44px 은 손가락 몫이지 여백이 아니다 */
  margin: -12px -8px -12px 0;
  border-radius: 12px; color: var(--muted);
  font-size: .82rem; font-weight: 600; letter-spacing: -.01em;
  transition: opacity .12s ease;
}
.view-btn:active { opacity: .5; }
.view-glyph { font-size: .95rem; line-height: 1; }

/* 둘 중 하나만 뜬다 */
#screen-run[data-view="one"]  #runList { display: none; }
#screen-run[data-view="list"] .card    { display: none; }

.run-list {
  position: relative;                     /* 아래 스크롤 계산의 기준점 */
  flex: 1 1 auto; min-height: 0;          /* 없으면 내부 스크롤이 안 생긴다 */
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  width: 100%; max-width: 560px; margin: 0 auto; padding: 8px 0;
  /* 위아래로 더 있다는 것을 보여주는 페이드 — 요약 화면과 같은 방식 */
  mask-image: linear-gradient(to bottom, transparent 0, #000 14px,
                              #000 calc(100% - 14px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px,
                              #000 calc(100% - 14px), transparent 100%);
}
.run-row {
  display: flex; gap: 12px; align-items: baseline;
  padding: 13px 10px; border-bottom: 1px solid var(--line);
  border-radius: 10px;
}
.run-num { flex: none; width: 2.1em; text-align: right;
           color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.run-body { flex: 1 1 auto; min-width: 0; }
.run-name { font-size: 1rem; line-height: 1.4; word-break: keep-all; }
.run-note { color: var(--muted); font-size: .8rem; margin-top: 3px; word-break: keep-all; }
.run-side { flex: none; color: var(--muted); font-size: .78rem;
            font-variant-numeric: tabular-nums; }
.run-side.reached { color: var(--accent); font-weight: 600; }

/* 지금 할 것 — 목록 안에서도 어느 것이 지금인지가 한눈에 들어와야 한다 */
.run-row[data-st="now"] {
  background: var(--btn-bg); color: var(--btn-fg); border-bottom-color: transparent;
}
.run-row[data-st="now"] .run-name { font-weight: 700; font-size: 1.12rem; }
.run-row[data-st="now"] .run-num,
.run-row[data-st="now"] .run-note,
.run-row[data-st="now"] .run-side { color: var(--btn-fg); opacity: .7; }
.run-row[data-st="now"] .run-side.reached { color: var(--btn-fg); opacity: 1; font-weight: 700; }

.run-row[data-st="todo"] { opacity: .45; }
.run-row[data-st="done"] .run-name { color: var(--muted); }
.run-row[data-st="skip"] .run-name { color: var(--muted); text-decoration: line-through; opacity: .6; }

/* ── 요약 화면 ─────────────────────────────────────────────────── */
#screen-done { gap: 20px; }
.done-head { text-align: center; padding-top: 12px; flex: none; }
.done-title { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 750; letter-spacing: -.02em; }
.done-total { color: var(--accent); font-size: clamp(2.4rem, 11vw, 3.6rem);
              font-weight: 750; font-variant-numeric: tabular-nums; margin-top: 6px; }
.done-note { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.summary {
  flex: 1 1 auto; min-height: 0;          /* ← 이게 없으면 스크롤이 안 생긴다 */
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  max-width: 560px; width: 100%; margin: 0 auto;
  border-top: 1px solid var(--line);
  /* 마지막 줄이 '처음으로' 버튼에 가려지지 않도록 */
  padding-bottom: 8px;
  /* 위아래로 더 있다는 것을 보여주는 페이드 */
  mask-image: linear-gradient(to bottom, transparent 0, #000 14px,
                              #000 calc(100% - 14px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px,
                              #000 calc(100% - 14px), transparent 100%);
}
#btnRestart { flex: none; margin-top: 4px; }
.summary div {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 13px 4px; border-bottom: 1px solid var(--line); font-size: .95rem;
}
.summary div span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.summary div.skip { color: var(--muted); }
.summary div.skip span:first-child { text-decoration: line-through; opacity: .65; }

/* ── 편집 화면 ─────────────────────────────────────────────────── */
#screen-edit { gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; }
.edit-head { display: flex; flex-wrap: wrap; justify-content: space-between;
            align-items: center; gap: 12px; flex: none; }
.edit-title { font-size: 1.15rem; font-weight: 700; }
.edit-hint {
  flex: none; color: var(--muted); font-size: .76rem; line-height: 1.65;
  border-left: 2px solid var(--line); padding-left: 12px;
}
.edit-hint code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--accent); font-size: .95em;
}
/* 번호 칸 + 입력칸 + (숨은) 거울.
   거울은 각 줄이 접혀서 실제로 몇 픽셀을 차지하는지 재는 용도다 —
   이걸 안 하면 두 줄로 접히는 긴 항목에서 번호가 어긋난다. */
.edit-body {
  position: relative; flex: 1 1 auto; min-height: 0;
  display: flex; align-items: stretch;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  transition: border-color .15s ease;
}
.edit-body.focused { border-color: var(--accent); }

.edit-gutter, #editText, .edit-mirror {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .92rem; line-height: 1.9;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
  padding-top: 14px; padding-bottom: 14px;
}
.edit-gutter {
  flex: none; width: 3em; padding-right: 10px; padding-left: 6px;
  text-align: right; color: var(--muted); opacity: .65;
  border-right: 1px solid var(--line);
  overflow: hidden; user-select: none; -webkit-user-select: none;
  font-variant-numeric: tabular-nums;
}
.edit-gutter b { display: block; font-weight: inherit; }
#editText {
  flex: 1 1 auto; min-width: 0; width: 100%;
  background: transparent; color: var(--fg);
  border: none; border-radius: 0;
  padding-left: 12px; padding-right: 14px;
  resize: none; outline: none; -webkit-appearance: none;
}
.edit-mirror {
  position: absolute; top: 0; left: 0;
  visibility: hidden; pointer-events: none;
  padding-left: 12px; padding-right: 14px;
  box-sizing: border-box;
}
.edit-status { flex: none; color: var(--muted); font-size: .8rem; text-align: center; min-height: 1.2em; }
.edit-status.warn { color: var(--accent); font-weight: 600; }
.edit-actions { flex: none; display: flex; gap: 10px; align-items: center; }
.edit-actions .primary { flex: 1; min-height: 58px; }
</style>
</head>
<body data-theme="light">

<div id="app">

  <!-- ════ 시작 화면 — 자주 쓰는 루틴만 큰 버튼으로 (D-023) ════ -->
  <section id="screen-start" class="screen active">
    <div class="start-head">
      <div class="start-brand">Routine</div>
      <button class="icon-btn" id="btnMore" title="가끔 하는 루틴"
              aria-label="가끔 하는 루틴">☰</button>
    </div>
    <div class="pick-list middle" id="mainPick"></div>
    <div class="start-actions">
      <button class="ghost" id="btnSound">🔔 소리 켬</button>
      <button class="ghost" id="btnEdit">✎ 루틴 편집</button>
    </div>
  </section>

  <!-- ════ 가끔 하는 루틴 ════ -->
  <section id="screen-more" class="screen">
    <div class="edit-head">
      <div class="edit-title">가끔 하는 루틴</div>
      <button class="icon-btn" id="btnMoreClose" title="닫기" aria-label="닫기">✕</button>
    </div>
    <div class="pick-list" id="morePick"></div>
  </section>

  <!-- ════ 편집 화면 ════ -->
  <section id="screen-edit" class="screen">
    <div class="edit-head">
      <div class="edit-title" id="editTitle">루틴 편집</div>
      <div class="mode-pick" id="editModePick"></div>
    </div>

    <div class="edit-hint">
      위 탭에서 고칠 루틴을 고른다. 한 줄에 항목 하나,
      <strong>줄 순서가 곧 실행 순서</strong>다.<br>
      <code>오일풀링 @10</code> → 10분에 알림 &nbsp;·&nbsp;
      <code>제자리뛰기 100회 | 가자미근</code> → <code>|</code> 뒤는 작은 설명<br>
      <strong>여기서 고친 것은 이 기기에 저장되지 않는다.</strong>
      버튼을 누르면 <strong>클로드코드용 지시문까지 함께</strong> 만들어진다.
      맥앱에서는 터미널이 열리며 바로 전달되고, 브라우저에서는 복사만 된다.
    </div>

    <div class="edit-body" id="editBody">
      <div class="edit-gutter" id="editGutter" aria-hidden="true"></div>
      <textarea id="editText" spellcheck="false" autocapitalize="off"
                autocorrect="off" autocomplete="off"></textarea>
      <div class="edit-mirror" id="editMirror" aria-hidden="true"></div>
    </div>

    <div class="edit-status" id="editStatus"></div>

    <div class="edit-actions">
      <button class="primary" id="btnEditCopy">전체 복사</button>
      <button class="ghost" id="btnEditCancel">닫기</button>
    </div>
  </section>

  <!-- ════ 항목 화면 ════ -->
  <section id="screen-run" class="screen">
    <div class="topbar">
      <div class="counter">
        <span id="cnt">1 / 26</span>
        <span class="counter-right">
          <span id="modeLabel">모닝</span>
          <!-- 뷰 방식 전환 — 한 항목 ↔ 전체 목록 (D-024) -->
          <button class="view-btn" id="btnView" type="button"></button>
        </span>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>

    <div class="card" id="card">
      <div class="item-name" id="itemName"></div>
      <div class="item-note" id="itemNote"></div>
      <div class="times" id="times"></div>
    </div>

    <!-- 전체 목록 뷰 (D-024). 카드와 둘 중 하나만 뜬다 -->
    <div class="run-list" id="runList"></div>

    <div class="bottom">
      <button class="primary" id="btnDone">완료</button>
      <div class="subactions">
        <button class="ghost" id="btnBack">← 이전</button>
        <button class="ghost" id="btnHome">홈</button>
        <button class="ghost" id="btnSkip">건너뛰기 →</button>
      </div>
    </div>
  </section>

  <!-- ════ 요약 화면 ════ -->
  <section id="screen-done" class="screen">
    <div class="done-head">
      <div class="done-title" id="doneTitle">루틴 완료</div>
      <div class="done-total" id="doneTotal">0:00</div>
      <div class="done-note">이 기록은 저장되지 않습니다</div>
    </div>
    <div class="summary" id="summary"></div>
    <button class="primary" id="btnRestart">처음으로</button>
  </section>

  <div class="footnote" id="ver"></div>
</div>

<script>

/* ═══════════════════════════════════════════════════════════════════

function loadSoundOn() {
  try { return localStorage.getItem(KEY_SOUND) !== 'off'; } catch (e) { return true; }

/* ═══════════════════════════════════════════════════════════════════
   3.5 텍스트 ↔ 목록 변환 (D-013)
       한 줄에 항목 하나. 줄 순서가 곧 실행 순서.
         이름                      → 그냥 항목
         이름 | 설명               → | 뒤는 작은 보조 설명
         이름 @10                  → 10분에 알림 (줄 맨 끝)
         이름 | 설명 @10           → 둘 다
         # 로 시작하는 줄, 빈 줄   → 무시
       이 형식이 곧 내보내기·불러오기 형식이다 (D-007 을 이 안으로 흡수).
   ═══════════════════════════════════════════════════════════════════ */
function parseItems(text) {
  const out = [];
  String(text).split('\n').forEach((raw) => {
    let line = raw.trim();
    if (!line || line.startsWith('#')) return;

    // ① 줄 맨 끝의 @숫자 를 먼저 떼어낸다
    let minutes = null;
    const mm = line.match(/\s@(\d{1,3})$/);
    if (mm) {
      minutes = parseInt(mm[1], 10) || null;
      line = line.slice(0, mm.index).trim();
    }

    // ② 첫 번째 | 로 이름과 설명을 가른다
    let name = line, note = '';
    const bar = line.indexOf('|');
    if (bar !== -1) {
      name = line.slice(0, bar).trim();
      note = line.slice(bar + 1).trim();
    }

    if (name) out.push({ name: name, note: note, minutes: minutes });
  });
  return out;
}

function serializeItems(items) {
  return items.map((it) => {
    let s = it.name;
    if (it.note) s += ' | ' + it.note;
    if (it.minutes) s += ' @' + it.minutes;
    return s;
  }).join('\n');
}

/* ═══════════════════════════════════════════════════════════════════
   4. 소리와 진동 (D-003)
      오디오 파일 없이 WebAudio 로 합성한다. 소리는 보조 신호이므로
      실패해도 앱 흐름에 영향을 주지 않게 전부 감싸 둔다.
   ═══════════════════════════════════════════════════════════════════ */
let audioCtx = null;

function wakeAudio() {
  // 첫 사용자 조작에서 호출. 브라우저 자동재생 정책 때문에 필요하다.
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}

function tone(freq, startAt, dur, peak) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startAt);
  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(peak, startAt + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(startAt);
  osc.stop(startAt + dur + 0.05);
}

// 완료: 맑은 "띵" — 5도 두 음을 겹쳐 종소리처럼
function ping() {
  if (!state.soundOn) return;
  try {
    wakeAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    tone(880,  t, 0.9, 0.22);
    tone(1320, t + 0.008, 0.7, 0.10);
  } catch (e) {}
}

// 지정 시간 도달: 두 번 울려 완료음과 구분한다
function chime() {
  if (!state.soundOn) return;
  try {
    wakeAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    tone(1046, t,        0.5, 0.20);
    tone(1046, t + 0.28, 0.7, 0.20);
  } catch (e) {}
}

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════════════
   5. 화면 꺼짐 방지 — 지원하지 않으면 조용히 무시
   ═══════════════════════════════════════════════════════════════════ */
let wakeLock = null;

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { wakeLock = null; }
}
function releaseAwake() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  // 탭에서 벗어났다 돌아오면 잠금이 풀려 있다. 실행 중이면 다시 건다.
  if (document.visibilityState === 'visible' && state.screen === 'run') keepAwake();
});

/* ═══════════════════════════════════════════════════════════════════
   6. 시간 — setInterval 로 누적하지 않고 항상 Date.now() 차이로 (D-004)
   ═══════════════════════════════════════════════════════════════════ */
function fmt(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function show(name) {
  state.screen = name;
  ['start', 'run', 'done', 'edit', 'more'].forEach((s) => {
    $('screen-' + s).classList.toggle('active', s === name);
  });
  $('ver').style.display = (name === 'run' || name === 'edit') ? 'none' : '';

/* 루틴 하나짜리 큰 버튼. 시작 화면과 ☰ 화면이 같은 것을 쓴다 */
function routineButton(key, suggested) {
  const data = ROUTINES[key];
  const b = document.createElement('button');
  b.className = 'routine-btn';
  b.dataset.key = key;
  if (suggested) b.dataset.suggested = 'true';

  const name = document.createElement('span');
  name.className = 'rb-name';
  name.textContent = data.label;

  const sub = document.createElement('span');
  sub.className = 'rb-sub';
  sub.textContent = data.items.length + '개 항목' + (suggested ? '  ·  지금 시간' : '');

  b.append(name, sub);
  return b;
}

/* 시작 화면을 다시 그린다. 시간대 제안은 그릴 때마다 새로 계산한다 —
   정오를 넘겨 돌아왔는데 옛 제안이 남아 있으면 안 된다. */
function paintStart() {
  const suggested = suggestKey();
  document.body.dataset.theme = ROUTINES[suggested].theme;
  const box = $('mainPick');
  box.textContent = '';
  routineKeys('main').forEach((k) => box.append(routineButton(k, k === suggested)));
}

/* ☰ 안쪽 — 가끔 하는 루틴. 여기서는 제안을 하지 않는다 */
function paintMore() {
  const box = $('morePick');
  box.textContent = '';
  const keys = routineKeys('more');
  if (!keys.length) {
    const empty = document.createElement('div');
    empty.className = 'more-empty';
    empty.textContent = '가끔 하는 루틴이 아직 없습니다';
    box.append(empty);
    return;
  }
  keys.forEach((k) => box.append(routineButton(k, false)));
}

  const b = $('btnView');
  b.textContent = '';
  const g = document.createElement('span');
  g.className = 'view-glyph';
  g.textContent = t.glyph;
  const s2 = document.createElement('span');
  s2.textContent = t.text;
  b.append(g, s2);
  b.setAttribute('aria-label', t.aria);
  b.title = t.aria;
}

function applyView() {
  $('screen-run').dataset.view = state.view;
  paintViewBtn();
}

function paintList() {
  const box = $('runList');
  box.textContent = '';
  state.items.forEach((item, i) => {
    const rec = state.records[i];            // 지나온 항목만 기록이 있다
    const row = document.createElement('div');
    row.className = 'run-row';
    row.dataset.st = i === state.idx ? 'now'
                   : rec ? (rec.skipped ? 'skip' : 'done')
                   : 'todo';
    if (i === state.idx) row.id = 'runNow';

    const num = document.createElement('span');
    num.className = 'run-num';
    num.textContent = i + 1;

    const body = document.createElement('div');
    body.className = 'run-body';
    const name = document.createElement('div');
    name.className = 'run-name';
    name.textContent = item.name;
    body.append(name);
    if (item.note) {
      const note = document.createElement('div');
      note.className = 'run-note';
      note.textContent = item.note;
      body.append(note);
    }

    const side = document.createElement('span');
    side.className = 'run-side';
    if (rec) side.textContent = rec.skipped ? '건너뜀' : fmt(rec.ms);
    else if (i === state.idx) side.id = 'runNowTime';   // tick() 이 채운다
    else if (item.minutes) side.textContent = item.minutes + '분';

    row.append(num, body, side);
    box.append(row);
  });
}

/* 목록이 길면 지금 할 것이 화면 밖으로 나간다 — 늘 가운데로 끌어온다.
   두 가지가 안 통해서 자리를 직접 계산해 넣는다 (크롬에서 확인) —
   scrollIntoView 는 이 목록 안을 굴리지 않고(바깥이 overflow:hidden 이다),
   scrollTo 의 behavior:'smooth' 는 아무 일도 하지 않는다. 부드럽게 밀리는
   맛보다 지금 할 것이 반드시 보이는 쪽이 중요하므로 바로 옮긴다. */
function scrollToNow() {
  const box = $('runList');
  const el = $('runNow');
  if (!box || !el) return;
  const want = el.offsetTop - (box.clientHeight - el.offsetHeight) / 2;
  box.scrollTop = Math.max(0, Math.min(want, box.scrollHeight - box.clientHeight));
}

/* 이 회차에만 걸리는 예외. 다음에 루틴을 시작하면 루틴의 기본값으로 돌아간다 */
function toggleView() {
  state.view = state.view === 'one' ? 'list' : 'one';
  applyView();
  if (state.screen === 'run' && state.view === 'list') {
    paintList();
    tick();          // 지금 항목의 시간을 빈칸으로 두지 않는다
    scrollToNow();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   9. 실행
   ═══════════════════════════════════════════════════════════════════ */
function start(key) {
  const data = ROUTINES[key];
  if (!data || !data.items.length) return;   // 빈 루틴은 시작하지 않는다

  wakeAudio();                      // 첫 조작에서 오디오를 깨워 둔다
  state.mode = key;
  document.body.dataset.theme = data.theme;
  // 뷰는 루틴마다 정해진다. 지난 회차에 손으로 바꿔 둔 것이 다음 루틴까지
  // 따라오면 안 된다 — 순서가 중요한 루틴에 다음 항목이 보여 버린다 (D-024)
  state.view = data.view;
  applyView();
  $('modeLabel').textContent = data.short;
  state.items = data.items;
  state.idx = 0;
  state.records = [];
  state.runStart = Date.now();
  show('run');
  keepAwake();
  render(false);
  if (!state.ticker) state.ticker = setInterval(tick, 250);
}

function render(animate) {
  const item = state.items[state.idx];
  if (!item) return finish();

  state.itemStart = Date.now();
  state.chimed = false;

  const paint = () => {
    $('itemName').textContent = item.name;
    $('itemNote').textContent = item.note || '';
    $('itemNote').style.display = item.note ? '' : 'none';
    $('cnt').textContent = (state.idx + 1) + ' / ' + state.items.length;
    $('barFill').style.width = (state.idx / state.items.length * 100) + '%';
    $('times').classList.remove('reached');
    if (state.view === 'list') { paintList(); scrollToNow(); }
    tick();
  };

  // 목록 뷰에서는 카드가 숨어 있어 넘어가는 애니메이션이 보이지 않는다.
  // 220ms 를 기다릴 이유가 없으므로 바로 그린다
  if (!animate || state.view === 'list') { paint(); return; }

  const card = $('card');
  card.classList.add('leaving');
  setTimeout(() => {
    paint();
    // 시간 계산은 화면이 실제로 바뀐 시점부터 — 전환 애니메이션을 항목
    // 소요시간에 넣지 않는다
    state.itemStart = Date.now();
    card.classList.remove('leaving');
    card.classList.add('entering');
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('entering')));
  }, 220);
}

function tick() {
  if (state.screen !== 'run') return;
  const item = state.items[state.idx];
  if (!item) return;

  const now = Date.now();
  const itemMs = now - state.itemStart;
  let text = '이 항목 ' + fmt(itemMs) + '  ·  전체 ' + fmt(now - state.runStart);

  if (item.minutes) {
    const goal = item.minutes * 60000;
    if (itemMs >= goal) {
      text += '  ·  ' + item.minutes + '분 지남';
      if (!state.chimed) {
        state.chimed = true;
        $('times').classList.add('reached');
        chime();
        buzz([40, 70, 40]);
      }
    } else {
      text += '  ·  목표 ' + item.minutes + '분';
    }
  }
  $('times').textContent = text;

  if (state.view === 'list') {
    const el = $('runNowTime');
    if (el) {
      el.textContent = fmt(itemMs) + (item.minutes ? '  /  ' + item.minutes + '분' : '');
      el.classList.toggle('reached', !!item.minutes && itemMs >= item.minutes * 60000);
    }
  }
}

function advance(skipped) {
  const item = state.items[state.idx];
  if (!item) return;

  state.records.push({
    name: item.name,
    ms: skipped ? null : Date.now() - state.itemStart,
    skipped: skipped,
  });

  if (skipped) {
    buzz(20);
  } else {
    ping();
    buzz(30);
  }

  state.idx++;
  if (state.idx >= state.items.length) return finish();
  render(true);
}

function back() {
  if (state.idx === 0) return;
  state.idx--;
  state.records.pop();
  render(true);   // 되돌아간 항목의 시간은 0부터 다시 잰다
}

/* 실행 도중 시작 화면으로 나간다 (B-24).
   진행 상태는 어차피 저장하지 않으므로(SPEC) 기록을 버리고 정리만 한다. */
function goHome() {
  releaseAwake();
  clearInterval(state.ticker);
  state.ticker = null;
  state.records = [];
  show('start');
  paintStart();
}

function finish() {
  releaseAwake();
  clearInterval(state.ticker);
  state.ticker = null;

  const totalMs = Date.now() - state.runStart;
  $('doneTitle').textContent = ROUTINES[state.mode].label + ' 완료';
  $('doneTotal').textContent = fmt(totalMs);

  const box = $('summary');
  box.innerHTML = '';
  state.records.forEach((r) => {
    const row = document.createElement('div');
    if (r.skipped) row.className = 'skip';
    const a = document.createElement('span');
    a.textContent = r.name;
    const b = document.createElement('span');
    b.textContent = r.skipped ? '건너뜀' : fmt(r.ms);
    row.append(a, b);
    box.append(row);
  });

  show('done');
}

/* ═══════════════════════════════════════════════════════════════════
   9.5 편집 화면 (D-013)
       편집·순서변경·내보내기·불러오기가 전부 이 한 화면이다.
   ═══════════════════════════════════════════════════════════════════ */
const editor = { mode: 'morning', draft: {} };

function openEditor() {
  editor.mode = ROUTINES[state.mode] ? state.mode : routineKeys('main')[0];
  editor.draft = {};
  Object.keys(ROUTINES).forEach((k) => {
    editor.draft[k] = serializeItems(ROUTINES[k].items);
  });
  paintEditTabs();
  show('edit');
  paintEditor();
}

/* 탭은 ROUTINES 에서 만든다 — 루틴을 늘려도 여기는 손대지 않는다 (D-023) */
function paintEditTabs() {
  const box = $('editModePick');
  box.textContent = '';
  Object.keys(ROUTINES).forEach((k) => {
    const b = document.createElement('button');
    b.dataset.mode = k;
    b.textContent = ROUTINES[k].short;
    box.append(b);
  });
}

function paintEditor() {
  document.body.dataset.theme = ROUTINES[editor.mode].theme;
  $('editText').value = editor.draft[editor.mode];
  $('editTitle').textContent = '루틴 텍스트';
  [...$('editModePick').children].forEach((b) => {
    b.setAttribute('aria-selected', String(b.dataset.mode === editor.mode));
  });
  paintEditStatus();
  // 화면에 붙은 뒤라야 폭이 잡혀 높이를 잴 수 있다
  requestAnimationFrame(paintGutter);
}

function paintEditStatus() {
  const el = $('editStatus');
  const keys = Object.keys(ROUTINES);
  const cur = parseItems(editor.draft[editor.mode]).length;
  const total = keys.reduce((s, k) => s + parseItems(editor.draft[k]).length, 0);
  el.textContent = ROUTINES[editor.mode].short + ' ' + cur + '개'
                 + '  ·  전체 ' + keys.length + '개 루틴 ' + total + '개';
  el.classList.toggle('warn', cur === 0);
  if (cur === 0) el.textContent += '  —  지금 보는 쪽이 비어 있습니다';
}

function stashEditor() { editor.draft[editor.mode] = $('editText').value; }

/* 번호 칸 그리기.
   줄마다 번호를 하나씩 붙이되, 긴 항목이 두 줄로 접히면 번호 칸의 그 칸도
   같은 높이여야 어긋나지 않는다. 그래서 숨은 거울에 같은 글자를 같은 폭으로
   넣어 실제 높이를 재고, 그 높이를 번호 칸에 그대로 준다. */
function paintGutter() {
  const ta = $('editText');
  const gutter = $('editGutter');
  const mirror = $('editMirror');

  const lines = ta.value.split('\n');
  mirror.style.width = ta.clientWidth + 'px';

  // 거울에 줄들을 채워 높이를 잰다 (빈 줄은 폭 없는 공백으로 높이를 확보)
  mirror.textContent = '';
  const probes = lines.map((line) => {
    const d = document.createElement('div');
    d.textContent = line === '' ? '​' : line;
    mirror.append(d);
    return d;
  });
  const heights = probes.map((d) => d.offsetHeight);

  gutter.textContent = '';
  lines.forEach((_, i) => {
    const b = document.createElement('b');
    b.textContent = String(i + 1);
    b.style.height = heights[i] + 'px';
    gutter.append(b);
  });

  gutter.scrollTop = ta.scrollTop;
}

/* 클립보드에 넣기. 실패하면 숨은 textarea + execCommand 로 한 번 더 시도한다
   (file:// 이나 구형 환경에서는 navigator.clipboard 가 막힌다) */
function toClipboard(text) {
  if (navigator.clipboard && location.protocol !== 'file:') {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const tmp = document.createElement('textarea');
    tmp.value = text;
    tmp.setAttribute('readonly', '');
    tmp.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.append(tmp);
    tmp.select();
    tmp.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    tmp.remove();
    ok ? resolve() : reject();
  });
}

/* 클로드코드에 그대로 붙여넣을 수 있는 지시문까지 붙여서 만든다 (D-018).
   개수를 함께 적어 두는 것이 중요하다 — 붙여넣다 줄이 잘리면 그것만이 단서다. */
function buildPrompt() {
  const key = editor.mode;                       // ROUTINES 의 키
  const label = ROUTINES[key].label;
  const body = editor.draft[key].trim();
  const count = parseItems(body).length;
  return [
    'github.com/powerprana7/morning-evening-routine 의 index.html 에서',
    'ROUTINES.' + key + ' 의 items 를 아래 목록으로 통째로 교체하고 push 해줘.',
    '',
    '형식: 한 줄에 항목 하나 · 줄 순서가 곧 실행 순서 · "|" 뒤는 보조 설명 · "@숫자"는 분 알림',
    '아래는 ' + label + ' ' + count + '개다. 반영 전에 개수가 맞는지 확인해줘.',
    '',
    '--- ' + label + ' 시작 ---',
    body,
    '--- ' + label + ' 끝 ---',
  ].join('\n');
}

/* 맥앱 안에서 실행 중인가 — 그렇다면 클로드코드를 바로 띄울 수 있다 (D-020) */
const inMacApp = !!(window.webkit && window.webkit.messageHandlers
                    && window.webkit.messageHandlers.claudeCode);

/* 지금 보고 있는 쪽을 지시문과 함께 클립보드로. 저장은 하지 않는다 (D-015) —
   이 화면은 "고쳐서 복사해 가는 곳"이지 이 기기에 남기는 곳이 아니다.
   맥앱 안에서는 복사에 더해 클로드코드까지 띄운다. */
function copyEditor() {
  stashEditor();
  const el = $('editStatus');
  const n = parseItems(editor.draft[editor.mode]).length;
  const prompt = buildPrompt();

  if (inMacApp) {
    // 클립보드에도 넣어 둔다 — 터미널이 안 뜨면 손으로 붙여넣을 수 있게
    toClipboard(prompt).catch(() => {});
    try { window.webkit.messageHandlers.claudeCode.postMessage(prompt); } catch (e) {}
    el.classList.remove('warn');
    el.textContent = '클로드코드로 보냈습니다 (' + n + '개) — 터미널을 확인하세요';
    ping();
    setTimeout(paintEditStatus, 3200);
    return;
  }

  toClipboard(prompt).then(() => {
    el.classList.remove('warn');
    el.textContent = '복사했습니다 (' + n + '개 + 지시문) — 클로드코드에 그대로 붙여넣으세요';
    ping();
    setTimeout(paintEditStatus, 3200);
  }, () => {
    const ta = $('editText');
    ta.focus(); ta.select();
    el.classList.add('warn');
    el.textContent = '클립보드가 막혀 본문만 선택했습니다 — 직접 복사하세요 (⌘C)';
    setTimeout(paintEditStatus, 3200);
  });
}

/* ═══════════════════════════════════════════════════════════════════
   10. 입력
   ═══════════════════════════════════════════════════════════════════ */
$('btnEdit').addEventListener('click', openEditor);

$('editModePick').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  stashEditor();                 // 지금 보던 쪽의 수정분을 잃지 않는다
  editor.mode = b.dataset.mode;
  paintEditor();
});

$('editText').addEventListener('input', () => {
  stashEditor(); paintEditStatus(); paintGutter();
});
$('editText').addEventListener('scroll', () => {
  $('editGutter').scrollTop = $('editText').scrollTop;
});
$('editText').addEventListener('focus', () => $('editBody').classList.add('focused'));
$('editText').addEventListener('blur',  () => $('editBody').classList.remove('focused'));
window.addEventListener('resize', () => { if (state.screen === 'edit') paintGutter(); });
$('btnEditCopy').addEventListener('click', copyEditor);
if (inMacApp) $('btnEditCopy').textContent = '클로드코드로 보내기';
$('btnEditCancel').addEventListener('click', () => {
  show('start');
  paintStart();
});

/* 루틴 버튼은 누르는 즉시 시작한다 — 고르기와 시작을 한 번에 (D-023) */
const pickHandler = (e) => {
  const b = e.target.closest('button.routine-btn');
  if (b) start(b.dataset.key);
};
$('mainPick').addEventListener('click', pickHandler);
$('morePick').addEventListener('click', pickHandler);

$('btnMore').addEventListener('click', () => { paintMore(); show('more'); });
$('btnMoreClose').addEventListener('click', () => { show('start'); paintStart(); });

$('btnDone').addEventListener('click', () => advance(false));
$('btnSkip').addEventListener('click', () => advance(true));
$('btnBack').addEventListener('click', back);
$('btnHome').addEventListener('click', goHome);
$('btnView').addEventListener('click', toggleView);

$('btnRestart').addEventListener('click', () => {
  show('start');
  paintStart();
});

$('btnSound').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  saveSoundOn(state.soundOn);
  paintSoundBtn();
  if (state.soundOn) ping();     // 켜는 순간 들려준다
});
function paintSoundBtn() {
  $('btnSound').textContent = state.soundOn ? '🔔 소리 켬' : '🔕 소리 끔';
}

document.addEventListener('keydown', (e) => {
  /* 고르기 화면들 — 엔터는 제안된 루틴, 숫자키는 위에서부터 n 번째 (맥에서 쓸 때) */
  if (state.screen === 'start' || state.screen === 'more') {
    const keys = routineKeys(state.screen === 'start' ? 'main' : 'more');
    if (state.screen === 'start' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); start(suggestKey()); return;
    }
    if (state.screen === 'more' && e.key === 'Escape') {
      e.preventDefault(); show('start'); paintStart(); return;
    }
    const nth = parseInt(e.key, 10);
    if (nth >= 1 && nth <= keys.length) { e.preventDefault(); start(keys[nth - 1]); }
    return;
  }
  if (state.screen !== 'run') return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(false); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); advance(true); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); back(); }
  else if (e.key === 'v' || e.key === 'V') { e.preventDefault(); toggleView(); }
});

/* ═══════════════════════════════════════════════════════════════════
   11. 시작
   ═══════════════════════════════════════════════════════════════════ */
// 시작 화면을 그린다. 정오를 경계로 하나를 제안해 두지만 누르는 것은 사용자다.
paintStart();
paintSoundBtn();
applyView();          // 버튼 딱지를 비워 두지 않는다. 실제 뷰는 start() 가 건다
$('ver').textContent = VERSION;

/* 편집은 맥에서만 한다 (D-015). 터치 기기에서는 진입 버튼을 감춘다 —
   안드로이드에서는 쓸 일이 없어 화면만 어지럽힌다.
   정밀 포인터(마우스·트랙패드)가 있거나 화면이 넓으면 데스크톱으로 본다. */
(function () {
  let desktop = true;
  try {
    desktop = window.matchMedia('(pointer: fine)').matches || window.innerWidth >= 900;
  } catch (e) { /* 판단이 안 되면 보여주는 쪽으로 (맥에서 못 쓰게 되는 것이 더 나쁘다) */ }
  if (!desktop) $('btnEdit').style.display = 'none';
})();

/* 오프라인 실행 + 자동 갱신 (https 에서만. file:// 에서는 조용히 넘어간다)
 *
 * 홈 화면에 설치한 PWA 는 주소창도 새로고침 버튼도 없어서, 앱 전환기에서 다시 열어도
 * 기존 페이지가 이어질 뿐 새로 받아오지 않는다. 그러면 push 한 수정이 그 기기에
 * 영영 안 온다 — 앱이 스스로 확인하게 만든다 (D-017). */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;

  const refreshIfIdle = () => {
    // 첫 설치 때는 새로고침하지 않는다 (제어권이 처음 생기는 것뿐이다)
    if (!hadController || reloading) return;
    // 루틴 진행 중이면 건드리지 않는다 — 진행이 날아간다 (D-008)
    if (state.screen === 'run') return;
    reloading = true;
    location.reload();
  };

  navigator.serviceWorker.addEventListener('controllerchange', refreshIfIdle);

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then((reg) => { reg.update(); })
      .catch(() => {});
  });

  // 앱으로 돌아올 때마다 새 버전이 있는지 확인한다
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    navigator.serviceWorker.getRegistration()
      .then((reg) => { if (reg) reg.update(); })
      .catch(() => {});
  });
}
</script>
</body>
</html>
